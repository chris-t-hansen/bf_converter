[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bf-converter"
version = "1.1.0"
description = "Trivial brainfuck substitution generator: turn a Markdown token chart into a working esolang"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "chris-t-hansen"}]
keywords = ["brainfuck", "esolang", "interpreter", "code-generator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
bf-converter = "bf_converter:main"

[tool.setuptools]
py-modules = ["bf_converter"]
